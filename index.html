
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinTrack Pro VN - Ultra Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        deep: {
                            0: '#000000',
                            1: '#070707',
                            2: '#0F0F0F',
                            3: '#141414',
                        },
                        brand: {
                            blue: '#3B82F6',
                            neon: '#60A5FA',
                            accent: '#2563EB',
                            gold: '#FBBF24',
                        }
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'Inter', 'sans-serif'],
                    },
                    fontSize: {
                        'xs': '0.75rem',    
                        'sm': '0.9rem',     
                        'base': '1.125rem', 
                        'lg': '1.4rem',   
                        'xl': '1.8rem',   
                        '2xl': '2.25rem',  
                        '3xl': '2.8rem',  
                        '4xl': '3.5rem',  
                        '5xl': '4.5rem',  
                        '6xl': '5.6rem',
                    },
                    borderRadius: {
                        '4xl': '32px',
                        '5xl': '40px',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #000000;
            color: #FFFFFF;
            font-family: 'Plus Jakarta Sans', sans-serif;
            letter-spacing: -0.03em;
            -webkit-font-smoothing: antialiased;
        }

        .glass-panel {
            background: linear-gradient(145deg, rgba(20, 20, 20, 0.7) 0%, rgba(10, 10, 10, 0.8) 100%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 32px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .glass-panel:hover {
            border: 1px solid rgba(255, 255, 255, 0.1);
            transform: translateY(-2px);
            background: linear-gradient(145deg, rgba(25, 25, 25, 0.8) 0%, rgba(15, 15, 15, 0.9) 100%);
        }

        .sidebar-item-active {
            background: rgba(255, 255, 255, 0.06);
            color: white;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
        }

        .sidebar-item-active svg {
            color: #60A5FA;
            filter: drop-shadow(0 0 5px rgba(96, 165, 250, 0.4));
        }

        .text-gradient-blue {
            background: linear-gradient(to bottom right, #FFFFFF 30%, #60A5FA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .btn-premium {
            background: #FFFFFF;
            color: #000000;
            border-radius: 16px;
            font-weight: 800;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .btn-premium:hover {
            transform: scale(1.03) translateY(-1px);
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        .glow-dot {
            position: relative;
        }
        .glow-dot::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            background: #60A5FA;
            border-radius: 50%;
            filter: blur(4px);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Hide Scrollbar but keep functionality */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "recharts": "https://esm.sh/recharts@^3.6.0"
  }
}
</script>
</head>
<body class="antialiased selection:bg-brand-blue/30">
    <div id="root"></div>
</body>
</html>
