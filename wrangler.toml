name = "fintrack-pro-vn"
main = "workers/api/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Account ID - Replace with your Cloudflare account ID
# Get it from: wrangler whoami
# account_id = "your_account_id_here"

# ============================================================================
# D1 Database Binding
# ============================================================================
# After creating D1 database with: wrangler d1 create fintrack-db
# Uncomment and add your database ID below

# [[d1_databases]]
# binding = "DB"
# database_name = "fintrack-db"
# database_id = "your_database_id_here"

# ============================================================================
# Environment Variables (Secrets)
# ============================================================================
# Set secrets with: wrangler secret put GEMINI_API_KEY
# Or use .dev.vars for local development

[vars]
ENVIRONMENT = "development"

# ============================================================================
# Development Configuration
# ============================================================================
[dev]
port = 8787
local_protocol = "http"

# ============================================================================
# Production Configuration (Optional)
# ============================================================================
[env.production]
# vars = { ENVIRONMENT = "production" }
# routes = [
#   { pattern = "api.fintrack.your-domain.com", zone_name = "your-domain.com" }
# ]

# ============================================================================
# Build Configuration
# ============================================================================
[build]
command = ""

[build.upload]
format = "service-worker"
